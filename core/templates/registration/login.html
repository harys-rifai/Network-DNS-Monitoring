{% extends "base.html" %}
{% load static %}

{% block title %}Login — Network-DNS-Monitoring{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1>Sign in</h1>
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div style="text-align:left; margin-bottom:14px;">
        {{ form.non_field_errors }}
      </div>
      <div style="margin-bottom:18px;">
        <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:6px;">Username</label>
        {{ form.username }}
      </div>
      <div style="margin-bottom:22px;">
        <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:6px;">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Log in</button>
    </form>
    <div class="links">
      <a href="{% url 'signup' %}">Create an account</a>
    </div>
  </div>
</div>
{% endblock %}
